<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>
    
<link rel="stylesheet" href="dashboard.css">

</head>

<body class="dashboard-body">

    <div class="sidebar">

        <h2>SMS</h2>

        <ul>
            <li>Dashboard</li>
            <li>Students</li>
            <li>Teachers</li>
            <li>Courses</li>
            <li>Attendance</li>
            <li>Marks</li>
            <li>Results</li>
            <li id="logoutBtn">Logout</li>
        </ul>

    </div>


    <div class="main-dashboard">

        <div class="topbar">

            <h1>Admin Dashboard</h1>

            <p>Welcome, Admin</p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <p>450</p>
            </div>

            <div class="card">
                <h3>Total Teachers</h3>
                <p>25</p>
            </div>

            <div class="card">
                <h3>Total Courses</h3>
                <p>15</p>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p>87%</p>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
